
version: 0.2

env:
  variables:
    GO_VERSION: "1.26.9"
    GOOS: "linux"
    GOARCH: "amd64"
    CGO_ENABLED: "0"

phases:
  install:
    commands:
      - 'echo "Installing Go ${GO_VERSION}..."'
      - 'curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz'
      - 'rm -rf "$HOME/go-sdk"'
      - 'mkdir -p "$HOME/go-sdk"'
      - 'tar -C "$HOME/go-sdk" -xzf /tmp/go.tar.gz'
      - 'export PATH="$HOME/go-sdk/go/bin:$PATH"'
      - '"$HOME/go-sdk/go/bin/go" version'

  pre_build:
    commands:
      - 'export PATH="$HOME/go-sdk/go/bin:$PATH"'
      - 'echo "Checking repository root..."'
      - 'pwd'
      - 'ls -la'
      - 'test -f go.mod || { echo "ERROR: go.mod is missing from the repository root"; exit 1; }'
      - 'test -d cmd || { echo "ERROR: cmd directory is missing"; exit 1; }'
      - 'echo "Go environment:"'
      - '"$HOME/go-sdk/go/bin/go" env GOOS GOARCH CGO_ENABLED GOTOOLCHAIN'
      - 'echo "Downloading dependencies..."'
      - '"$HOME/go-sdk/go/bin/go" mod download'
      - 'echo "Checking Go formatting..."'
      - 'UNFORMATTED=$(find . -type f -name "*.go" -not -path "./vendor/*" -print0 | xargs -0 "$HOME/go-sdk/go/bin/gofmt" -l); if [ -n "$UNFORMATTED" ]; then echo "ERROR: Go files need formatting:"; echo "$UNFORMATTED"; exit 1; fi'
      - 'echo "Formatting check passed."'
      - 'mkdir -p build'

  build:
    commands:
      - 'echo "Running Go tests with detailed output..."'
      - '"$HOME/go-sdk/go/bin/go" test -v ./...'
      - 'echo "Go tests passed."'
      - 'echo "Running go vet..."'
      - '"$HOME/go-sdk/go/bin/go" vet ./...'
      - 'echo "Building API Gateway..."'
      - '"$HOME/go-sdk/go/bin/go" build -o build/api-gateway ./cmd/api-gateway'
      - 'echo "Building Auth Service..."'
      - '"$HOME/go-sdk/go/bin/go" build -o build/auth-service ./cmd/auth-service'
      - 'echo "Building Product Service..."'
      - '"$HOME/go-sdk/go/bin/go" build -o build/product-service ./cmd/product-service'
      - 'echo "Building Order Service..."'
      - '"$HOME/go-sdk/go/bin/go" build -o build/order-service ./cmd/order-service'
      - 'echo "Building Database Check..."'
      - '"$HOME/go-sdk/go/bin/go" build -o build/check-db-connected ./cmd/check-db-connected'
      - 'echo "Building Load Test..."'
      - '"$HOME/go-sdk/go/bin/go" build -o build/load-test ./cmd/load-test'
      - 'echo "All six binaries built successfully."'

  post_build:
    commands:
      - 'if [ -d build ]; then echo "Build directory contents:"; ls -lh build/; else echo "Build directory is missing."; fi'

artifacts:
  base-directory: build
  files:
    - 'api-gateway'
    - 'auth-service'
    - 'product-service'
    - 'order-service'
    - 'check-db-connected'
    - 'load-test'
  discard-paths: yes

cache:
  paths:
    - '/root/.cache/go-build/**/*'
    - '/root/go/pkg/mod/**/*'
