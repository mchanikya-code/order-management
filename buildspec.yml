
version: 0.2

env:
  variables:
    GO_VERSION: "1.26.9"
    GOOS: "linux"
    GOARCH: "amd64"
    CGO_ENABLED: "0"

phases:
  install:
    commands:
      - 'echo "Installing Go ${GO_VERSION}..."'
      - 'curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz'
      - 'rm -rf "$HOME/go-sdk"'
      - 'mkdir -p "$HOME/go-sdk"'
      - 'tar -C "$HOME/go-sdk" -xzf /tmp/go.tar.gz'
      - 'export PATH="$HOME/go-sdk/go/bin:$PATH"'
      - 'go version'

  pre_build:
    commands:
      - 'export PATH="$HOME/go-sdk/go/bin:$PATH"'
      - 'echo "Checking project directory..."'
      - 'pwd'
      - 'ls -la'
      - 'test -f go.mod || { echo "ERROR: go.mod not found"; exit 1; }'
      - 'echo "Downloading dependencies..."'
      - 'go mod download'
      - 'echo "Checking Go formatting..."'
      - 'UNFORMATTED=$(find . -type f -name "*.go" -not -path "./vendor/*" -print0 | xargs -0 gofmt -l); if [ -n "$UNFORMATTED" ]; then echo "Files need formatting:"; echo "$UNFORMATTED"; exit 1; fi'
      - 'echo "Formatting check passed."'

  build:
    commands:
      - 'export PATH="$HOME/go-sdk/go/bin:$PATH"'
      - 'echo "Running Go tests..."'
      - 'go test -v ./...'
      - 'echo "Running go vet..."'
      - 'go vet ./...'
      - 'echo "Creating build directory..."'
      - 'mkdir -p build'
      - 'go build -o build/api-gateway ./cmd/api-gateway'
      - 'go build -o build/auth-service ./cmd/auth-service'
      - 'go build -o build/product-service ./cmd/product-service'
      - 'go build -o build/order-service ./cmd/order-service'
      - 'go build -o build/check-db-connected ./cmd/check-db-connected'
      - 'go build -o build/load-test ./cmd/load-test'
      - 'echo "All binaries built successfully."'

  post_build:
    commands:
      - 'echo "Checking build artifacts..."'
      - 'test -d build && ls -lh build/'

artifacts:
  base-directory: build
  files:
    - 'api-gateway'
    - 'auth-service'
    - 'product-service'
    - 'order-service'
    - 'check-db-connected'
    - 'load-test'
  discard-paths: yes

cache:
  paths:
    - '/root/.cache/go-build/**/*'
    - '/root/go/pkg/mod/**/*'
